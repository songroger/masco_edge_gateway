id: solar-controller-g3
name: 第三代太阳能控制器
version: V1.00
source: docs/mptt-modbus.pdf
models:
- XTRA-N G3
- XTRA-N G3 BLE
- Tracer-AN G3
- Tracer-CPN系列
comm:
  protocol: Modbus-RTU
  default_slave_id: 1
  baudrate: 115200
  bytesize: 8
  parity: N
  stopbits: 1
  flow_control: false
  address_format: hex
  address_base: '0x00'
  int32_layout: L寄存器 + H寄存器（低字在前）
registers:
- address_hex: '0x0000'
  address: 0
  name: 充电开关
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 1=开启充电, 0=关闭充电
- address_hex: '0x0002'
  address: 2
  name: 输出手动控制开关
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 手动控制模式下 1=开启输出, 0=关闭输出
- address_hex: '0x000D'
  address: 13
  name: 恢复出厂设置
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 1=恢复出厂默认, 0=否
- address_hex: '0x000E'
  address: 14
  name: 累计电量清零
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 1=清除统计量(Root权限), 0=否
- address_hex: '0x2000'
  address: 8192
  name: 设备机内超温
  kind: discrete_input
  fc_read: '0x02'
  data_type: bool
  scale: 1
  access: R
  note: 1=超温保护, 0=正常
- address_hex: '0x2001'
  address: 8193
  name: 功率器件温度过高
  kind: discrete_input
  fc_read: '0x02'
  data_type: bool
  scale: 1
  access: R
  note: 1=超温保护, 0=正常
- address_hex: '0x3000'
  address: 12288
  name: PV最大输入电压
  kind: input
  fc_read: '0x04'
  data_type: uint16
  scale: 100
