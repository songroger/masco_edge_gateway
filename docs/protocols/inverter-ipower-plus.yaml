id: inverter-ipower-plus
name: 逆变器通信协议
version: V1.0
source: docs/IPower-Plus.pdf
models:
- IP系列
- IP-Plus系列
- NP系列
comm:
  protocol: Modbus-RTU
  default_slave_id: 3
  baudrate: 115200
  bytesize: 8
  parity: N
  stopbits: 1
  flow_control: false
  address_format: hex
  address_base: '0x00'
  int32_layout: L寄存器 + H寄存器（低字在前）
registers:
- address_hex: '0x3108'
  address: 12552
  name: 放电设备输入电压
  kind: input
  fc_read: '0x04'
  data_type: uint16
  scale: 100
  access: R
  unit: V
- address_hex: '0x3109'
  address: 12553
  name: 放电设备输入电流
  kind: input
  fc_read: '0x04'
  data_type: uint16
  scale: 100
  access: R
  unit: A
  note: 始终为0表示硬件不支持
- address_hex: '0x310A'
  address: 12554
  name: 放电设备输入功率L
  kind: input
  fc_read: '0x04'
  data_type: uint32_l
  scale: 100
  access: R
  unit: W
- address_hex: '0x310B'
  address: 12555
  name: 放电设备输入功率H
  kind: input
  fc_read: '0x04'
  data_type: uint32_h
  scale: 100
  access: R
  unit: W
- address_hex: '0x310C'
  address: 12556
  name: 放电设备输出电压
  kind: input
  fc_read: '0x04'
  data_type: uint16
  scale: 100
  access: R
  unit: V
- address_hex: '0x310D'
  address: 12557
  name: 放电设备输出电流
  kind: input
  fc_read: '0x04'
  data_type: uint16
  scale: 100
  access: R
  unit: A
- address_hex: '0x310E'
  address: 12558
  name: 放电设备输出功率L
  kind: input
  fc_read: '0x04'
  data_type: uint32_l
  scale: 100
  access: R
  unit: W
- address_hex: '0x310F'
  address: 12559
  name: 放电设备输出功率H
  kind: input
  fc_read: '0x04'
  data_type: uint32_h
  scale: 100
  access: R
  unit: W
- address_hex: '0x3111'
  address: 12561
  name: 设备机内温度
  kind: input
  fc_read: '0x04'
  data_type: int16
  scale: 100
  access: R
  unit: ℃
- address_hex: '0x3112'
  address: 12562
  name: 散热器温度
  kind: input
  fc_read: '0x04'
  data_type: int16
  scale: 100
  access: R
  unit: ℃
- address_hex: '0x3202'
  address: 12802
  name: 放电设备状态
  kind: input
  fc_read: '0x04'
  data_type: uint16
  scale: 1
  access: R
  note: '位域: 输入/输出/故障/运行状态'
- address_hex: '0x2000'
  address: 8192
  name: 设备超温
  kind: discrete_input
  fc_read: '0x02'
  data_type: bool
  scale: 1
  access: R
  note: 1=机内温度过温保护, 0=正常
- address_hex: '0x9022'
  address: 36898
  name: 输出交流电压设置
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
  note: 110V:110/120; 220V:220/230
- address_hex: '0x9023'
  address: 36899
  name: 输出交流频率设置
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: Hz
  note: 50或60, 部分型号支持
- address_hex: '0x902F'
  address: 36911
  name: 输入电压低限
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
  note: 过放立即, 不可修改
- address_hex: '0x9030'
  address: 36912
  name: 输入电压低限(5秒)
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
- address_hex: '0x9031'
  address: 36913
  name: 输入电压低限恢复点
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
- address_hex: '0x9032'
  address: 36914
  name: 输入电压高限恢复点
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
- address_hex: '0x9033'
  address: 36915
  name: 输入电压高限(5秒)
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
- address_hex: '0x9034'
  address: 36916
  name: 输入电压高限
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: V
  note: 超压立即, 不可修改
- address_hex: '0x9035'
  address: 36917
  name: 输入电流高限
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: A
  note: 不可修改
- address_hex: '0x9036'
  address: 36918
  name: 输入电流高限恢复点
  kind: holding
  fc_read: '0x03'
  data_type: uint16
  scale: 100
  access: RW
  fc_write: '0x10'
  unit: A
  note: 不可修改
- address_hex: '0x0013'
  address: 19
  name: 清除故障
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 1=清除当前及历史故障
- address_hex: '0x0011'
  address: 17
  name: 本地/远程控制
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 1=远程, 0=本地
- address_hex: '0x000F'
  address: 15
  name: 逆变器启停
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 远程模式下 1=启动, 0=关闭
- address_hex: '0x0004'
  address: 4
  name: 节电模式使能
  kind: coil
  fc_read: '0x01'
  data_type: bool
  scale: 1
  access: RW
  fc_write: '0x05'
  note: 仅SHI系列, 1=使能, 0=禁用
